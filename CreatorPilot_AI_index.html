<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CreatorPilot AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#111827}.container{max-width:850px;margin:auto;padding:20px}.header{background:#111827;color:#fff;padding:35px 20px;border-radius:25px;text-align:center;margin-bottom:25px}.header h1{margin:0;font-size:38px}.header p{color:#cbd5e1;font-size:20px}.card{background:#fff;padding:25px;border-radius:22px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,.06)}h2{margin-top:0;font-size:28px}label{display:block;font-weight:bold;margin:18px 0 8px}textarea,select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}textarea{min-height:120px;resize:vertical}button{width:100%;padding:16px;margin-top:22px;border:0;border-radius:12px;background:#111827;color:#fff;font-size:18px;font-weight:bold}.video-button{background:#2563eb}.copy-btn{width:auto;padding:10px 18px;margin-top:10px;font-size:14px}.result,.video-result{display:none}.result-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:15px;padding:18px;margin-top:12px;white-space:pre-wrap;line-height:1.6}.loading{display:none;text-align:center;padding:15px;font-weight:bold}.video-preview{width:100%;max-height:500px;border-radius:18px;background:#000;margin-top:15px}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:15px;border-radius:12px;line-height:1.5}.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.error{background:#fef2f2;border-color:#fecaca;color:#b91c1c}pre{white-space:pre-wrap;overflow-wrap:anywhere}.footer{text-align:center;color:#64748b;padding:20px;font-size:14px}
</style></head><body><div class="container"><div class="header"><h1>🚀 CreatorPilot AI</h1><p>Turn your idea into viral content</p></div><div class="card"><h2>🎬 Create Your Video</h2><label>Video Idea</label><textarea id="idea" placeholder="Example: A funny aloo vlog in Dubai"></textarea><label>Platform</label><select id="platform"><option>TikTok</option><option>YouTube Shorts</option><option>Instagram Reels</option><option>YouTube</option></select><label>Duration</label><select id="duration"><option>10 seconds</option><option>15 seconds</option><option>30 seconds</option><option>60 seconds</option></select><label>Language</label><select id="language"><option>Roman Urdu</option><option>Urdu</option><option>English</option></select><label>Style</label><select id="style"><option>Funny</option><option>Viral</option><option>Emotional</option><option>Horror</option><option>Storytelling</option><option>Educational</option><option>Motivational</option></select><button onclick="generateContent()">🚀 Generate Script</button><button class="video-button" onclick="generateVideo()">🎬 Generate Video</button><div class="loading" id="loading">⏳ Creating your content...</div></div><div class="card result" id="result"><h2>✨ Your Content</h2><h3>🎬 Video Script</h3><div class="result-box" id="script"></div><button class="copy-btn" onclick="copyText('script')">📋 Copy Script</button><h3>🎤 Voice Over</h3><div class="result-box" id="voice"></div><button class="copy-btn" onclick="copyText('voice')">📋 Copy Voice Over</button><h3>📝 Caption</h3><div class="result-box" id="caption"></div><button class="copy-btn" onclick="copyText('caption')">📋 Copy Caption</button><h3>#️⃣ Hashtags</h3><div class="result-box" id="hashtags"></div><button class="copy-btn" onclick="copyText('hashtags')">📋 Copy Hashtags</button></div><div class="card video-result" id="videoResult"><h2>🎥 AI Video</h2><div class="notice" id="videoMessage"></div><video id="videoPreview" class="video-preview" controls playsinline style="display:none"></video></div><div class="footer">CreatorPilot AI 🚀 | Create. Post. Grow.</div></div><script>
function generateContent(){const i=document.getElementById("idea").value.trim(),p=document.getElementById("platform").value,d=document.getElementById("duration").value,l=document.getElementById("language").value,s=document.getElementById("style").value;if(!i){alert("Pehle apni video idea likho! 😄");return}document.getElementById("loading").style.display="block";setTimeout(()=>{let sc="",v="";if(l==="Roman Urdu"){sc="🎬 SCENE 1\nCamera video idea par focus kare: "+i+"\n\n🎬 SCENE 2\nFast camera movement aur engaging visuals. Style: "+s+".\n\n🎬 SCENE 3\nMain moment ko close-up mein show karo.\n\n🎬 SCENE 4\nEnd mein strong hook: Follow karo aur next video miss mat karna!";v="Aaj ki video ka idea hai: "+i+".\n\nIs video ko "+s.toLowerCase()+" style mein present karenge.\n\nAgar video pasand aaye to follow zaroor karna! 🚀"}else if(l==="Urdu"){sc="🎬 منظر 1\nویڈیو کا آغاز اس آئیڈیا سے کریں: "+i+"\n\n🎬 منظر 2\nتیز اور دلچسپ ویژولز دکھائیں۔ انداز: "+s+"\n\n🎬 منظر 3\nاہم لمحے کو کلوز اپ میں دکھائیں۔\n\n🎬 منظر 4\nآخر میں کہیں: فالو کریں اور اگلی ویڈیو ضرور دیکھیں!";v="آج کی ویڈیو کا آئیڈیا ہے: "+i+".\n\nاس ویڈیو کو "+s+" انداز میں پیش کیا جائے گا۔\n\nاگر ویڈیو پسند آئے تو فالو ضرور کریں! 🚀"}else{sc="🎬 SCENE 1\nStart with an attention-grabbing shot about: "+i+"\n\n🎬 SCENE 2\nUse fast visuals and engaging camera movement. Style: "+s+".\n\n🎬 SCENE 3\nShow the main moment with a close-up shot.\n\n🎬 SCENE 4\nFinish with a strong call-to-action: Follow for more!";v="Today's video idea is: "+i+".\n\nWe're turning this idea into a "+s.toLowerCase()+" video for "+p+".\n\nFollow for more amazing content! 🚀"}document.getElementById("script").innerText=sc;document.getElementById("voice").innerText=v;document.getElementById("caption").innerText="🔥 "+i+" | "+s+" content for "+p+" | "+d;document.getElementById("hashtags").innerText="#CreatorPilotAI #ViralVideo #ContentCreator #TikTok #Reels #Shorts #"+s.replace(/\s/g,"")+" #FYP";document.getElementById("loading").style.display="none";document.getElementById("result").style.display="block"},700)}
async function generateVideo(){const i=document.getElementById("idea").value.trim(),p=document.getElementById("platform").value,d=document.getElementById("duration").value,l=document.getElementById("language").value,s=document.getElementById("style").value;if(!i){alert("Pehle video idea likho! 😄");return}const r=document.getElementById("videoResult"),m=document.getElementById("videoMessage"),v=document.getElementById("videoPreview");r.style.display="block";v.style.display="none";v.removeAttribute("src");m.className="notice";m.innerHTML="⏳ AI video generate ho rahi hai...<br><br>🎬 Idea: <b>"+escapeHTML(i)+"</b><br>⚙️ Please wait...";try{const prompt="Create a high-quality "+d+" video for "+p+". Language/context: "+l+". Style: "+s+". Video idea: "+i+". Make the visuals engaging, cinematic, clear and suitable for social media.";const x=await fetch("/api/generate-video",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})}),t=x.headers.get("content-type")||"";if(!x.ok){let e="Video generation failed.";try{e=t.includes("application/json")?(await x.json()).error||"API error":await x.text()}catch(q){}throw new Error(e)}if(t.includes("video/")||t.includes("application/octet-stream")){const b=await x.blob();v.src=URL.createObjectURL(b);v.style.display="block";v.load();m.className="notice success";m.innerHTML="✅ Video successfully generate ho gayi! 🎉<br>Neeche Play button dabao."}else{let q;try{q=await x.json()}catch(e){q=await x.text()}m.innerHTML="⚠️ API ne video file ke bajaye response diya:<br><br><pre>"+escapeHTML(typeof q==="string"?q:JSON.stringify(q,null,2))+"</pre>"}}catch(e){m.className="notice error";m.innerHTML="❌ Video generate nahi ho saki.<br><br><b>Error:</b><br>"+escapeHTML(e.message)}window.scrollTo({top:r.offsetTop-20,behavior:"smooth"})}
function copyText(id){const t=document.getElementById(id).innerText;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("✅ Copied!")).catch(()=>alert("Copy nahi ho saka."));else alert("Text manually copy kar lo.")}
function escapeHTML(t){const d=document.createElement("div");d.textContent=String(t);return d.innerHTML}
</script></body></html>
