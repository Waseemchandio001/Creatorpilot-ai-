<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreatorPilot AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #111827;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.header {
  background: #111827;
  color: white;
  padding: 35px 20px;
  border-radius: 25px;
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 38px;
}

.header p {
  color: #cbd5e1;
  font-size: 20px;
  margin-bottom: 0;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

h2 {
  margin-top: 0;
  font-size: 28px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.copy-btn {
  width: auto;
  padding: 10px 18px;
  margin-top: 10px;
  font-size: 14px;
}

.result {
  display: none;
}

.result-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 15px;
  padding: 18px;
  margin-top: 12px;
  white-space: pre-wrap;
  line-height: 1.6;
}

.loading {
  display: none;
  text-align: center;
  padding: 15px;
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #64748b;
  padding: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🚀 CreatorPilot AI</h1>
    <p>Turn your idea into viral content</p>
  </div>

  <div class="card">

    <h2>🎬 Create Your Video</h2>

    <label>Video Idea</label>

    <textarea
      id="idea"
      placeholder="Example: A funny aloo vlog in Dubai"
    ></textarea>

    <label>Platform</label>

    <select id="platform">
      <option>TikTok</option>
      <option>YouTube Shorts</option>
      <option>Instagram Reels</option>
      <option>YouTube</option>
    </select>

    <label>Duration</label>

    <select id="duration">
      <option>10 seconds</option>
      <option>15 seconds</option>
      <option>30 seconds</option>
      <option>60 seconds</option>
    </select>

    <label>Language</label>

    <select id="language">
      <option>Roman Urdu</option>
      <option>Urdu</option>
      <option>English</option>
    </select>

    <label>Style</label>

    <select id="style">
      <option>Funny</option>
      <option>Viral</option>
      <option>Emotional</option>
      <option>Horror</option>
      <option>Storytelling</option>
      <option>Educational</option>
      <option>Motivational</option>
    </select>

    <button onclick="generateContent()">
      🚀 Generate Script
    </button>

    <div class="loading" id="loading">
      ⏳ Creating your content...
    </div>

  </div>


  <div class="card result" id="result">

    <h2>✨ Your Content</h2>

    <h3>🎬 Video Script</h3>
    <div class="result-box" id="script"></div>
    <button class="copy-btn" onclick="copyText('script')">
      📋 Copy Script
    </button>


    <h3>🎤 Voice Over</h3>
    <div class="result-box" id="voice"></div>
    <button class="copy-btn" onclick="copyText('voice')">
      📋 Copy Voice Over
    </button>


    <h3>📝 Caption</h3>
    <div class="result-box" id="caption"></div>
    <button class="copy-btn" onclick="copyText('caption')">
      📋 Copy Caption
    </button>


    <h3>#️⃣ Hashtags</h3>
    <div class="result-box" id="hashtags"></div>
    <button class="copy-btn" onclick="copyText('hashtags')">
      📋 Copy Hashtags
    </button>

  </div>


  <div class="footer">
    CreatorPilot AI 🚀 | Create. Post. Grow.
  </div>

</div>


<script>

function generateContent() {

  const idea = document.getElementById("idea").value.trim();
  const platform = document.getElementById("platform").value;
  const duration = document.getElementById("duration").value;
  const language = document.getElementById("language").value;
  const style = document.getElementById("style").value;

  if (!idea) {
    alert("Pehle apni video idea likho! 😄");
    return;
  }

  document.getElementById("loading").style.display = "block";
  document.getElementById("result").style.display = "none";

  setTimeout(function() {

    let script = "";
    let voice = "";

    if (language === "Roman Urdu") {

      script =
      "🎬 SCENE 1\\n" +
      "Camera video idea par focus kare: " + idea + "\\n\\n" +

      "🎬 SCENE 2\\n" +
      "Fast camera movement aur engaging visuals. Style: " + style + ".\\n\\n" +

      "🎬 SCENE 3\\n" +
      "Main moment ko close-up mein show karo aur viewer ki attention hold rakho.\\n\\n" +

      "🎬 SCENE 4\\n" +
      "End mein strong hook aur call-to-action: \"Follow karo aur next video miss mat karna!\"";


      voice =
      "Aaj ki video ka idea hai: " + idea + ".\\n\\n" +
      "Is video mein hum is idea ko " + style.toLowerCase() +
      " style mein present karenge.\\n\\n" +
      "Agar aapko video pasand aaye to follow zaroor karna aur next video ke liye ready rehna! 🚀";

    }

    else if (language === "Urdu") {

      script =
      "🎬 منظر 1\\n" +
      "ویڈیو کا آغاز اس آئیڈیا سے کریں: " + idea + "\\n\\n" +

      "🎬 منظر 2\\n" +
      "تیز اور دلچسپ ویژولز دکھائیں۔ انداز: " + style + "\\n\\n" +

      "🎬 منظر 3\\n" +
      "اہم لمحے کو کلوز اپ میں دکھائیں۔\\n\\n" +

      "🎬 منظر 4\\n" +
      "آخر میں کہیں: فالو کریں اور اگلی ویڈیو ضرور دیکھیں!";

      voice =
      "آج کی ویڈیو کا آئیڈیا ہے: " + idea + ".\\n\\n" +
      "اس ویڈیو کو " + style + " انداز میں پیش کیا جائے گا۔\\n\\n" +
      "اگر ویڈیو پسند آئے تو فالو ضرور کریں! 🚀";

    }

    else {

      script =
      "🎬 SCENE 1\\n" +
      "Start with an attention-grabbing shot about: " + idea + "\\n\\n" +

      "🎬 SCENE 2\\n" +
      "Use fast visuals and engaging camera movement. Style: " + style + ".\\n\\n" +

      "🎬 SCENE 3\\n" +
      "Show the main moment with a close-up shot.\\n\\n" +

      "🎬 SCENE 4\\n" +
      "Finish with a strong call-to-action: Follow for more!";

      voice =
      "Today's video idea is: " + idea + ".\\n\\n" +
      "We're turning this idea into a " + style.toLowerCase() +
      " video for " + platform + ".\\n\\n" +
      "Follow for more amazing content! 🚀";

    }


    const caption =
      "🔥 " + idea +
      " | " + style +
      " content for " + platform +
      " | " + duration;


    const hashtags =
      "#CreatorPilotAI #ViralVideo #ContentCreator #TikTok #Reels #Shorts #" +
      style.replace(/\s/g, "") +
      " #FYP";


    document.getElementById("script").innerText = script;
    document.getElementById("voice").innerText = voice;
    document.getElementById("caption").innerText = caption;
    document.getElementById("hashtags").innerText = hashtags;

    document.getElementById("loading").style.display = "none";
    document.getElementById("result").style.display = "block";

    window.scrollTo({
      top: document.getElementById("result").offsetTop - 20,
      behavior: "smooth"
    });

  }, 1000);

}


function copyText(id) {

  const text = document.getElementById(id).innerText;

  navigator.clipboard.writeText(text).then(function() {

    alert("✅ Copied!");

  }).catch(function() {

    alert("Copy nahi ho saka, text manually select kar lo.");

  });

}

</script>

</body>
</html>
